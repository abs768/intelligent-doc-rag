name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs all 37 tests. The 5 Testcontainers tests (MultiTenantIsolationDemoTest,
      # GroundedRagIntegrationTest) start real Postgres + Qdrant containers via the
      # Docker daemon available on GitHub-hosted runners. JaCoCo report is bound to
      # the test phase in pom.xml.
      - name: Run tests
        working-directory: backend
        run: mvn -B --no-transfer-progress test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend tests + build (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      # CI=true (set by Actions) makes CRA treat eslint warnings as errors.
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t docgpt-backend ./backend

      - name: Build frontend image
        run: docker build -t docgpt-frontend ./frontend
