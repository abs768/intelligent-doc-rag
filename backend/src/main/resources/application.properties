spring.application.name=ai-chat-assistant
server.port=8080

# PostgreSQL - Use environment variables with fallback to localhost
# PostgreSQL - Connect to Docker container on port 5433
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chatassistant}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Ollama - Use environment variables with fallback to localhost
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=tinyllama
ollama.embedding-model=nomic-embed-text

# Qdrant - Use environment variables with fallback to localhost
qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6334}
qdrant.collection=documents

# JWT
jwt.secret=${JWT_SECRET:your-secret-key-that-should-be-at-least-256-bits-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.root=INFO
logging.level.com.chatassistant=DEBUG